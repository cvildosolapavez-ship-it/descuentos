name: Actualizar descuentos

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días a las 07:00 de Chile (10:00 UTC)
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Leer descuentos de los bancos
        run: python scraper.py --out descuentos.json

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Descuentos actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
