<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descuentos del Día</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Descuentos">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: app de una columna; cabecera fija con días, filtros en chips deslizables, lista de cupones tipo "ticket" */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#dde2ec;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#1d3d8f; --chip:#e8ecf4; --warn:#9a5b00;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#161d30; --ink:#eef1f8; --muted:#9aa5bf; --line:#27304a;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#8fb0ff; --chip:#1f2840; --warn:#f2b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#161d30; --ink:#eef1f8; --muted:#9aa5bf; --line:#27304a;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#8fb0ff; --chip:#1f2840; --warn:#f2b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:12px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{background:var(--accent);color:var(--accent-ink);padding:0 .25em;border-radius:6px}
.date{color:var(--muted);font-size:.85rem;text-transform:capitalize}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 0;font:600 .8rem var(--body);cursor:pointer;display:grid;gap:2px;justify-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.day b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}
.label button{background:none;border:0;color:var(--brand);font:600 .75rem var(--body);text-transform:none;letter-spacing:0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.chip.zero{opacity:.45}
.summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.summary strong{color:var(--ink);font-family:var(--display);font-size:1.1rem}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:.85rem}
.list{display:grid;gap:10px}
.deal{display:grid;grid-template-columns:84px 1fr;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.pct{background:var(--accent);color:var(--accent-ink);display:grid;place-content:center;text-align:center;position:relative;padding:10px 4px}
.pct b{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.pct small{font-size:.68rem;font-weight:700;text-transform:uppercase}
.pct::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--surface)}
.info{padding:12px 14px;min-width:0;display:grid;gap:5px}
.info h3{margin:0;font-size:1rem;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.fav{background:none;border:0;font-size:1.15rem;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.fav[aria-pressed="true"]{color:#e0a800}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem}
.tag{padding:2px 8px;border-radius:999px;background:var(--chip);font-weight:600;display:flex;gap:5px;align-items:center}
.tag i{width:8px;height:8px;border-radius:50%}
.cond{color:var(--muted);font-size:.82rem}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;align-items:center}
.foot a{color:var(--brand);font-weight:600;text-decoration:none}
.vig{color:var(--warn);font-weight:600}
.vig.ok{color:var(--muted);font-weight:500}
.more{border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:12px;font:600 .9rem var(--body);cursor:pointer}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border-radius:16px}
.note{margin-top:24px;font-size:.78rem;color:var(--muted);display:grid;gap:6px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1>Descuentos <span>hoy</span></h1>
      <div class="date" id="date"></div>
    </div>
    <div class="days" id="days" role="group" aria-label="Día de la semana"></div>
  </header>

  <input class="search" id="q" type="search" placeholder="Buscar comercio o ciudad (ej. Starbucks, Iquique)" aria-label="Buscar comercio o ciudad">

  <div class="label">Banco <button id="clearBanks">Todos</button></div>
  <div class="chips" id="banks" role="group" aria-label="Filtrar por banco"></div>

  <div class="label">Categoría <button id="clearCats">Todas</button></div>
  <div class="chips" id="cats" role="group" aria-label="Filtrar por categoría"></div>

  <div class="summary">
    <div><strong id="count">0</strong> descuentos</div>
    <select id="sort" aria-label="Ordenar">
      <option value="pct">Mayor descuento</option>
      <option value="name">Comercio A–Z</option>
      <option value="fav">Favoritos primero</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <div class="note">
    <p style="margin:0" id="upd"></p><p style="margin:0">Los descuentos marcados en color salieron de guías anteriores y pueden haber cambiado.</p>
    <p style="margin:0">Confirma siempre condiciones y vigencia en la app de tu banco antes de pagar.</p>
  </div>
</div>


<script>
const BANKS={
  bchile:{n:"Banco de Chile",c:"#1f4fa3"}, estado:{n:"BancoEstado",c:"#f28c00"},
  santander:{n:"Santander",c:"#e30613"}, bci:{n:"BCI",c:"#5a5a5a"},
  scotia:{n:"Scotiabank",c:"#c8102e"}, itau:{n:"Itaú",c:"#ec7000"},
  falabella:{n:"Banco Falabella",c:"#3a8f2f"}, security:{n:"Security",c:"#6b2c91"},
  ripley:{n:"Banco Ripley",c:"#8a2be2"}
};
const CATS={comida:"🍔 Comida",entretenimiento:"🎬 Entretención",belleza:"💅 Belleza",moda:"👗 Moda",
  supermercado:"🛒 Súper",viajes:"✈️ Viajes",salud:"💊 Salud",bencina:"⛽ Bencina",otros:"🏷️ Otros"};

let DEALS=[];
const ALL=[0,1,2,3,4,5,6];
const DOW=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const today=new Date().getDay();
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const st={day:today,banks:new Set(store.get("banks",[])),cats:new Set(store.get("cats",[])),favs:new Set(store.get("favs2",[])),q:"",sort:"pct",limit:40};

const $=id=>document.getElementById(id);
$("date").textContent=new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});

const onDay=d=>DEALS.filter(x=>x.days.includes(d));
function renderDays(){
  const order=[1,2,3,4,5,6,0];
  $("days").innerHTML=order.map(d=>`<button class="day" data-d="${d}" aria-pressed="${d===st.day}">
    <span>${DOW[d]}</span><b>${onDay(d).length}</b>${d===today?'<span class="dot" aria-label="hoy"></span>':''}</button>`).join("");
  document.querySelector("h1 span").textContent = st.day===today?"hoy":DOW[st.day].toLowerCase();
}
function renderChips(){
  const day=onDay(st.day);
  $("banks").innerHTML=Object.entries(BANKS).map(([k,b])=>{const n=day.filter(x=>x.bank===k).length;
    return `<button class="chip${n?'':' zero'}" data-bank="${k}" aria-pressed="${st.banks.has(k)}"><i style="background:${b.c}"></i>${b.n} <small>${n}</small></button>`}).join("");
  $("cats").innerHTML=Object.entries(CATS).map(([k,c])=>{const n=day.filter(x=>x.cat===k).length;
    return `<button class="chip${n?'':' zero'}" data-cat="${k}" aria-pressed="${st.cats.has(k)}">${c} <small>${n}</small></button>`}).join("");
}
function renderList(){
  const q=st.q.trim().toLowerCase();
  let r=onDay(st.day).filter(d=>(!st.banks.size||st.banks.has(d.bank))&&(!st.cats.size||st.cats.has(d.cat))&&(!q||(d.shop+" "+d.loc).toLowerCase().includes(q)));
  r.sort(st.sort==="name"?(a,b)=>a.shop.localeCompare(b.shop):st.sort==="fav"?(a,b)=>(st.favs.has(b.id)-st.favs.has(a.id))||b.pct-a.pct:(a,b)=>(!!a.perLitre-!!b.perLitre)||b.pct-a.pct||a.shop.localeCompare(b.shop));
  $("count").textContent=r.length;
  const total=r.length;r=r.slice(0,st.limit);
  $("list").innerHTML=r.length?r.map(d=>{const b=BANKS[d.bank];const days=d.days.length===7?"Todos los días":d.days.map(x=>DOW[x]).join(", ");
    return `<article class="deal">
    <div class="pct">${d.perLitre?`<b>$${d.pct}</b><small>x litro</small>`:`${d.upTo?'<small>hasta</small>':''}<b>${d.pct}%</b><small>dcto</small>`}</div>
    <div class="info"><h3>${d.shop}<button class="fav" data-fav="${d.id}" aria-pressed="${st.favs.has(d.id)}" aria-label="Favorito">${st.favs.has(d.id)?"★":"☆"}</button></h3>
    <div class="meta"><span class="tag"><i style="background:${b.c}"></i>${b.n}</span><span class="tag">${CATS[d.cat]}</span>${d.loc?`<span class="tag">📍 ${d.loc}</span>`:""}</div>
    <div class="cond">${d.cond} · ${days}</div>
    <div class="foot"><span class="vig${/^Visto|confirmar/i.test(d.vig||'')?'':' ok'}">${d.vig||''}</span><a href="${d.url}" target="_blank" rel="noopener">Ver fuente ↗</a></div></div></article>`}).join("")+(total>r.length?`<button class="more" id="more">Ver más (${total-r.length} restantes)</button>`:"")
    :`<div class="empty">No hay descuentos para el ${DOW[st.day]} con estos filtros.<br>Prueba otro día o quita algún filtro.</div>`;
}
function all(){renderDays();renderChips();renderList()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="more"){st.limit+=40;renderList()}
  else if(t.dataset.d){st.day=+t.dataset.d;st.limit=40;all()}
  else if(t.dataset.bank){const k=t.dataset.bank;st.banks.has(k)?st.banks.delete(k):st.banks.add(k);store.set("banks",[...st.banks]);renderChips();renderList()}
  else if(t.dataset.cat){const k=t.dataset.cat;st.cats.has(k)?st.cats.delete(k):st.cats.add(k);store.set("cats",[...st.cats]);renderChips();renderList()}
  else if(t.dataset.fav){const k=+t.dataset.fav;st.favs.has(k)?st.favs.delete(k):st.favs.add(k);store.set("favs2",[...st.favs]);renderList()}
  else if(t.id==="clearBanks"){st.banks.clear();store.set("banks",[]);renderChips();renderList()}
  else if(t.id==="clearCats"){st.cats.clear();store.set("cats",[]);renderChips();renderList()}
});
$("q").addEventListener("input",e=>{st.q=e.target.value;st.limit=40;renderList()});
$("sort").addEventListener("change",e=>{st.sort=e.target.value;renderList()});
async function cargar(){
  $("list").innerHTML='<div class="empty">Cargando descuentos…</div>';
  try{
    const r=await fetch("descuentos.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    DEALS=(Array.isArray(j)?j:j.descuentos).map((d,i)=>({...d,id:d.id??i,upTo:!!d.upTo,loc:d.loc||"",days:d.days?.length?d.days:ALL}));
    if(j.actualizado) $("upd").textContent="Actualizado: "+new Date(j.actualizado).toLocaleString("es-CL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    all();
  }catch(e){
    $("list").innerHTML='<div class="empty">No se pudieron cargar los descuentos ('+e.message+').<br>Revisa tu conexión y vuelve a abrir la app.</div>';
  }
}
cargar();
</script>
</body>
</html>
