<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descuentos del Día</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Descuentos">
<meta name="theme-color" content="#14213d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: app de una columna; cabecera fija con días, filtros en chips deslizables, lista de cupones tipo "ticket" */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#dde2ec;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#1d3d8f; --chip:#e8ecf4; --warn:#9a5b00;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#161d30; --ink:#eef1f8; --muted:#9aa5bf; --line:#27304a;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#8fb0ff; --chip:#1f2840; --warn:#f2b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#161d30; --ink:#eef1f8; --muted:#9aa5bf; --line:#27304a;
  --accent:#ffc83d; --accent-ink:#14213d; --brand:#8fb0ff; --chip:#1f2840; --warn:#f2b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:12px}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{background:var(--accent);color:var(--accent-ink);padding:0 .25em;border-radius:6px}
.date{color:var(--muted);font-size:.85rem;text-transform:capitalize}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 0;font:600 .8rem var(--body);cursor:pointer;display:grid;gap:2px;justify-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.day b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.day small{font-size:.66rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}
.label button{background:none;border:0;color:var(--brand);font:600 .75rem var(--body);text-transform:none;letter-spacing:0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .85rem var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.chip.zero{opacity:.45}
.summary{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-size:.9rem;color:var(--muted)}
.summary strong{color:var(--ink);font-family:var(--display);font-size:1.1rem}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit;font-size:.85rem}
.list{display:grid;gap:10px}
.deal{display:grid;grid-template-columns:84px 1fr;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.pct{background:var(--accent);color:var(--accent-ink);display:grid;place-content:center;text-align:center;position:relative;padding:10px 4px}
.pct b{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.pct small{font-size:.68rem;font-weight:700;text-transform:uppercase}
.pct::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed var(--surface)}
.info{padding:12px 14px;min-width:0;display:grid;gap:5px}
.info h3{margin:0;font-size:1rem;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.fav{background:none;border:0;font-size:1.15rem;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.fav[aria-pressed="true"]{color:#e0a800}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem}
.tag{padding:2px 8px;border-radius:999px;background:var(--chip);font-weight:600;display:flex;gap:5px;align-items:center}
.tag i{width:8px;height:8px;border-radius:50%}
.cond{color:var(--muted);font-size:.82rem}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;align-items:center}
.foot .vermas{color:var(--brand);font-weight:600}
.foot a{color:var(--brand);font-weight:600;text-decoration:none}
.vig{color:var(--warn);font-weight:600}
.vig.ok{color:var(--muted);font-weight:500}
.more{border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:12px;font:600 .9rem var(--body);cursor:pointer}
.deal{cursor:pointer;transition:transform .12s ease}
.deal:active{transform:scale(.99)}
.deal:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,24,.5)}
.sheet-panel{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:subir .22s ease-out}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}.deal{transition:none}}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center}
.sh-head .pct{border-radius:14px;min-height:76px}
.sh-head h2{margin:0;font-family:var(--display);font-size:1.3rem;line-height:1.15;text-wrap:balance}
.sh-close{border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;align-self:start}
.sh-rows{display:grid;gap:10px;margin:16px 0}
.sh-row{background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:8px;min-width:0}
.sh-row .ic{font-size:1.1rem;line-height:1.4}
.sh-row h4{margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sh-row p{margin:0;font-size:.92rem;overflow-wrap:anywhere}
.sh-row ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.sh-row li{font-size:.9rem;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sh-row li a,.sh-row p a{color:var(--brand);font-weight:600;text-decoration:none;white-space:nowrap}
.daypills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.daypills span{padding:3px 9px;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:600;color:var(--muted)}
.daypills span.on{background:var(--ink);color:var(--bg)}
.sh-actions{display:grid;gap:8px}
.btn{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;font-size:1rem}
.btn-pri{background:var(--accent);color:var(--accent-ink)}
.btn-sec{background:var(--chip);color:var(--ink)}
.sh-note{font-size:.8rem;color:var(--muted);margin:2px 2px 0}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border-radius:16px}
.note{margin-top:24px;font-size:.78rem;color:var(--muted);display:grid;gap:6px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1>Descuentos <span>hoy</span></h1>
      <div class="date" id="date"></div>
    </div>
    <div class="days" id="days" role="group" aria-label="Día de la semana"></div>
  </header>

  <input class="search" id="q" type="search" placeholder="Buscar comercio o ciudad (ej. Starbucks, Iquique)" aria-label="Buscar comercio o ciudad">

  <div class="label">Banco <button id="clearBanks">Todos</button></div>
  <div class="chips" id="banks" role="group" aria-label="Filtrar por banco"></div>

  <div class="label">Categoría <button id="clearCats">Todas</button></div>
  <div class="chips" id="cats" role="group" aria-label="Filtrar por categoría"></div>

  <div class="label">Región <button id="clearRegs">Todas</button></div>
  <div class="chips" id="regs" role="group" aria-label="Filtrar por región"></div>

  <div class="summary">
    <div><strong id="count">0</strong> descuentos<span id="count-nac"></span></div>
    <select id="sort" aria-label="Ordenar">
      <option value="pct">Mayor descuento</option>
      <option value="name">Comercio A–Z</option>
      <option value="fav">Favoritos primero</option>
    </select>
  </div>

  <div class="list" id="list"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-panel" id="sheet-panel"></div>
  </div>
  <div class="note">
    <p style="margin:0" id="upd"></p><p style="margin:0">Los descuentos marcados en color salieron de guías anteriores y pueden haber cambiado.</p>
    <p style="margin:0">Confirma siempre condiciones y vigencia en la app de tu banco antes de pagar.</p>
  </div>
</div>


<script>
const BANKS={
  bchile:{n:"Banco de Chile",c:"#1f4fa3"}, estado:{n:"BancoEstado",c:"#f28c00"},
  santander:{n:"Santander",c:"#e30613"}, bci:{n:"BCI",c:"#5a5a5a"},
  scotia:{n:"Scotiabank",c:"#c8102e"}, itau:{n:"Itaú",c:"#ec7000"},
  falabella:{n:"Banco Falabella",c:"#3a8f2f"}, security:{n:"Security",c:"#6b2c91"},
  ripley:{n:"Banco Ripley",c:"#8a2be2"}, bice:{n:"Banco BICE",c:"#1b3a6b"},
  internacional:{n:"Banco Internacional",c:"#0072ce"}, consorcio:{n:"Banco Consorcio",c:"#d6001c"},
  coopeuch:{n:"Coopeuch",c:"#e30613"}, mach:{n:"MACH",c:"#6c2bd9"}, tenpo:{n:"Tenpo",c:"#00b26b"},
  mercadopago:{n:"Mercado Pago",c:"#00a8e8"}, losheroes:{n:"Los Héroes",c:"#f39200"},
  otros:{n:"Otras tarjetas",c:"#8a8f9c"}
};
const REGIONES=[["arica","Arica y Parinacota"],["tarapaca","Tarapacá"],["antofagasta","Antofagasta"],["atacama","Atacama"],
  ["coquimbo","Coquimbo"],["valparaiso","Valparaíso"],["rm","Metropolitana"],["ohiggins","O'Higgins"],["maule","Maule"],
  ["nuble","Ñuble"],["biobio","Biobío"],["araucania","La Araucanía"],["losrios","Los Ríos"],["loslagos","Los Lagos"],
  ["aysen","Aysén"],["magallanes","Magallanes"]];
const bankOf=k=>BANKS[k]||{n:k,c:"#8a8f9c"};
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
const CATS={comida:"🍔 Comida",entretenimiento:"🎬 Entretención",belleza:"💅 Belleza",moda:"👗 Moda",
  supermercado:"🛒 Súper",viajes:"✈️ Viajes",salud:"💊 Salud",bencina:"⛽ Bencina",otros:"🏷️ Otros"};

let DEALS=[];
const ALL=[0,1,2,3,4,5,6];
const DOW=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const now=new Date();
const today=now.getDay();
// La semana parte el domingo y se renueva cada domingo: Dom 18, Lun 19 … Sáb 24
const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-today);
const dateOf=d=>new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+d);
const MESES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
// "Hasta 31 de octubre de 2026" -> fecha de término (null si no se puede leer)
function finVigencia(v){
  const m=(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").match(/(\d{1,2})\s+de\s+([a-z]+)(?:\s+(?:de|del)\s+(\d{4}))?/);
  if(!m||MESES[m[2]]===undefined)return null;
  const y=m[3]?+m[3]:now.getFullYear();
  return new Date(y,MESES[m[2]],+m[1],23,59);
}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const st={day:today,banks:new Set(store.get("banks",[])),cats:new Set(store.get("cats",[])),regs:new Set(store.get("regs",[])),favs:new Set(store.get("favs2",[])),q:"",sort:"pct",limit:40};

const $=id=>document.getElementById(id);
function renderDate(){$("date").textContent=dateOf(st.day).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});}

// Descuentos válidos ese día de la semana y todavía vigentes en esa fecha
const onDay=d=>{const f=dateOf(d);return DEALS.filter(x=>{if(!x.days.includes(d))return false;const fin=finVigencia(x.vig);return !fin||fin>=f;});};
// Filtros cruzados: cada grupo cuenta según los demás filtros activos (día, banco, categoría, búsqueda)
const okBank=d=>!st.banks.size||st.banks.has(d.bank);
const okCat=d=>!st.cats.size||st.cats.has(d.cat);
// Región: muestra lo de esa región más lo válido en todo Chile u online
const okReg=d=>!st.regs.size||(d.regs||[]).some(r=>st.regs.has(r)||r==="nac");
// Comunas a mostrar: si hay región elegida, primero las de esa región
function comunasDe(d){
  const L=d.lugares&&d.lugares.length?d.lugares:(d.loc||"").split(",").map(x=>[x.trim(),""]).filter(x=>x[0]);
  if(!st.regs.size)return L.map(x=>x[0]);
  return [...L.filter(x=>st.regs.has(x[1])),...L.filter(x=>!st.regs.has(x[1]))].map(x=>x[0]);
}
function lugarVisible(d){const c=comunasDe(d);return c.slice(0,3).join(", ")+(c.length>3?` +${c.length-3}`:"");}
const okQ=d=>{const q=st.q.trim().toLowerCase();return !q||(d.shop+" "+comunasDe(d).join(" ")).toLowerCase().includes(q);};
function renderDays(){
  const order=[0,1,2,3,4,5,6];
  $("days").innerHTML=order.map(d=>{const n=onDay(d).filter(x=>okBank(x)&&okCat(x)&&okReg(x)&&okQ(x)).length;
    return `<button class="day" data-d="${d}" aria-pressed="${d===st.day}" aria-label="${dateOf(d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}, ${n} descuentos">
    <span>${DOW[d]}</span><b>${dateOf(d).getDate()}</b><small>${n}</small>${d===today?'<span class="dot" aria-label="hoy"></span>':''}</button>`}).join("");
  document.querySelector("h1 span").textContent = st.day===today?"hoy":`${DOW[st.day].toLowerCase()} ${dateOf(st.day).getDate()}`;
  renderDate();
}
function renderChips(){
  const day=onDay(st.day).filter(okQ);
  // Bancos: cuentan según la categoría elegida. El orden usa el total del día, así no saltan al tocar.
  const total=k=>day.filter(x=>x.bank===k).length;
  const nBank=k=>day.filter(x=>x.bank===k&&okCat(x)&&okReg(x)).length;
  const sb=$("banks").scrollLeft, sc=$("cats").scrollLeft;
  $("banks").innerHTML=Object.entries(BANKS)
    .sort((a,b)=>(st.banks.has(b[0])-st.banks.has(a[0]))||total(b[0])-total(a[0]))
    .map(([k,b])=>{const n=nBank(k);
    return `<button class="chip${n?'':' zero'}" data-bank="${k}" aria-pressed="${st.banks.has(k)}"><i style="background:${b.c}"></i>${b.n} <small>${n}</small></button>`}).join("");
  // Categorías: cuentan según el día y los bancos elegidos
  $("cats").innerHTML=Object.entries(CATS).map(([k,c])=>{const n=day.filter(x=>x.cat===k&&okBank(x)&&okReg(x)).length;
    return `<button class="chip${n?'':' zero'}" data-cat="${k}" aria-pressed="${st.cats.has(k)}">${c} <small>${n}</small></button>`}).join("");
  // Regiones: cuentan solo lo que tiene local en esa región (sin los de todo Chile)
  const sr=$("regs").scrollLeft;
  $("regs").innerHTML=REGIONES.map(([k,nombre])=>{const n=day.filter(x=>(x.regs||[]).includes(k)&&okBank(x)&&okCat(x)).length;
    return `<button class="chip${n?'':' zero'}" data-reg="${k}" aria-pressed="${st.regs.has(k)}">${nombre} <small>${n}</small></button>`}).join("");
  $("banks").scrollLeft=sb; $("cats").scrollLeft=sc; $("regs").scrollLeft=sr;
}
function renderList(){
  const q=st.q.trim().toLowerCase();
  let r=onDay(st.day).filter(d=>okBank(d)&&okCat(d)&&okReg(d)&&okQ(d));
  const local=d=>st.regs.size&&(d.regs||[]).some(x=>st.regs.has(x))?0:1;  // con región elegida, primero lo local
  const orden=st.sort==="name"?(a,b)=>a.shop.localeCompare(b.shop):st.sort==="fav"?(a,b)=>(st.favs.has(b.id)-st.favs.has(a.id))||b.pct-a.pct:(a,b)=>(!!a.perLitre-!!b.perLitre)||b.pct-a.pct||a.shop.localeCompare(b.shop);
  r.sort((a,b)=>local(a)-local(b)||orden(a,b));
  $("count").textContent=r.length;
  const nac=st.regs.size?r.filter(d=>!(d.regs||[]).some(x=>st.regs.has(x))).length:0;
  $("count-nac").textContent=nac?` · ${nac} válidos en todo Chile u online`:"";
  const total=r.length;r=r.slice(0,st.limit);
  $("list").innerHTML=r.length?r.map(d=>{const b=bankOf(d.bank);const days=d.days.length===7?"Todos los días":d.days.map(x=>DOW[x]).join(", ");
    return `<article class="deal" data-id="${d.id}" tabindex="0" aria-label="Ver detalle de ${esc(d.shop)}">
    <div class="pct">${d.perLitre?`<b>$${d.pct}</b><small>x litro</small>`:`${d.upTo?'<small>hasta</small>':''}<b>${d.pct}%</b><small>dcto</small>`}</div>
    <div class="info"><h3>${esc(d.shop)}<button class="fav" data-fav="${d.id}" aria-pressed="${st.favs.has(d.id)}" aria-label="Favorito">${st.favs.has(d.id)?"★":"☆"}</button></h3>
    <div class="meta"><span class="tag"><i style="background:${b.c}"></i>${esc(b.n)}</span><span class="tag">${CATS[d.cat]||esc(d.cat)}</span>${d.loc?`<span class="tag">📍 ${esc(lugarVisible(d))}</span>`:(d.regs||[]).includes("nac")?`<span class="tag">🇨🇱 Todo Chile</span>`:""}</div>
    <div class="cond">${esc(d.cond)} · ${days}</div>
    <div class="foot"><span class="vig${/^Visto|confirmar/i.test(d.vig||'')?'':' ok'}">${esc(d.vig)}</span><span class="vermas">Ver detalle ›</span></div></div></article>`}).join("")+(total>r.length?`<button class="more" id="more">Ver más (${total-r.length} restantes)</button>`:"")
    :`<div class="empty">No hay descuentos para el ${DOW[st.day]} ${dateOf(st.day).getDate()} con estos filtros.<br>Prueba otro día o quita algún filtro.</div>`;
}
function all(){renderDays();renderChips();renderList()}


// ---------- Detalle de un descuento ----------
const DIAS_LARGOS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ARTICULOS=/neatpagos|theclinic|chocale|pauta\.cl|biobiochile|13\.cl|t13\.cl|encancha|centralnoticia/i;
function tipoEnlace(u){
  try{const x=new URL(u);
    if(ARTICULOS.test(x.hostname))return "articulo";
    if(/\/detalle\/|\/beneficios\/[^/]+\/[^/]+/.test(x.pathname))return "detalle";
    return "seccion";
  }catch{return "seccion"}
}
// Apple Maps: con dirección exacta se marca el punto; con solo la comuna se busca el local en esa comuna.
// Siempre se agrega ", Chile" para no caer en ciudades homónimas de otros países.
const mapaDir=(local,dir)=>`https://maps.apple.com/?q=${encodeURIComponent(local)}&address=${encodeURIComponent(dir+", Chile")}`;
const mapaComuna=(local,comuna)=>`https://maps.apple.com/?q=${encodeURIComponent(local+", "+comuna+", Chile")}`;
let ultimoFoco=null;
function abrirDetalle(id){
  const d=DEALS.find(x=>String(x.id)===String(id)); if(!d)return;
  const b=bankOf(d.bank); const tipo=tipoEnlace(d.url);
  const dias=d.days.length===7?[0,1,2,3,4,5,6]:d.days;
  const validoHoy=d.days.includes(st.day);
  const dirs=(d.dir&&d.dir.length?d.dir:[]);
  const comunas=comunasDe(d);
  const nombreReg=k=>(REGIONES.find(r=>r[0]===k)||[,""])[1];
  const regsTxt=(d.regs||[]).filter(r=>r!=="nac").map(nombreReg).filter(Boolean).join(", ");
  const ubic=dirs.length
    ?`<ul>${dirs.map(a=>`<li><span>${esc(a)}</span><a href="${mapaDir(d.shop,a)}" target="_blank" rel="noopener">Mapa ↗</a></li>`).join("")}</ul>`
    :comunas.length
    ?`<ul>${comunas.map(c=>`<li><span>${esc(c)}</span><a href="${mapaComuna(d.shop,c)}" target="_blank" rel="noopener">Buscar en mapa ↗</a></li>`).join("")}</ul>
      <p class="sh-note" style="margin-top:6px">El banco no informa la dirección exacta; el mapa busca el local en esa comuna.</p>`
    :(d.regs||[]).includes("nac")?`<p>Válido en todo Chile u online.</p>`
    :regsTxt?`<p>Región de ${esc(regsTxt)}. Dirección no informada.</p>`
    :`<p>No informada. Revisa los locales adheridos en el enlace del banco.</p>`;
  const etiqueta={detalle:"Ir al descuento ↗",seccion:`Ver en el sitio de ${esc(b.n)} ↗`,articulo:"Ver la fuente ↗"}[tipo];
  const nota={detalle:"",
    seccion:`${esc(b.n)} no tiene una página propia para cada descuento. Te llevamos a la sección donde aparece; búscalo como "${esc(d.shop)}".`,
    articulo:"Este descuento viene de un artículo de prensa. Confírmalo en la app de tu banco antes de pagar."}[tipo];
  $("sheet-panel").innerHTML=`<div class="grip"></div>
    <div class="sh-head">
      <div class="pct">${d.perLitre?`<b>$${d.pct}</b><small>x litro</small>`:`${d.upTo?'<small>hasta</small>':''}<b>${d.pct}%</b><small>dcto</small>`}</div>
      <div style="min-width:0"><h2 id="sh-title">${esc(d.shop)}</h2>
        <div class="meta" style="margin-top:6px"><span class="tag"><i style="background:${b.c}"></i>${esc(b.n)}</span><span class="tag">${CATS[d.cat]||esc(d.cat)}</span></div></div>
      <button class="sh-close" id="sh-close" aria-label="Cerrar">✕</button>
    </div>
    <div class="sh-rows">
      <div class="sh-row"><span class="ic">📅</span><div><h4>Días</h4>
        <p>${validoHoy?`Válido el ${DIAS_LARGOS[st.day].toLowerCase()} ${dateOf(st.day).getDate()}`:"No aplica el día elegido"}</p>
        <div class="daypills">${[1,2,3,4,5,6,0].map(x=>`<span class="${dias.includes(x)?"on":""}">${DOW[x]}</span>`).join("")}</div></div></div>
      <div class="sh-row"><span class="ic">🕒</span><div><h4>Horario</h4><p>${d.horario?esc(d.horario):"No informado. Consulta en el local antes de pagar."}</p></div></div>
      <div class="sh-row"><span class="ic">📍</span><div><h4>Ubicación</h4>${ubic}</div></div>
      <div class="sh-row"><span class="ic">💳</span><div><h4>Condiciones</h4><p>${esc(d.cond)}</p>${d.desc&&d.desc!==d.cond?`<p style="margin-top:6px;color:var(--muted)">${esc(d.desc)}</p>`:""}</div></div>
      ${d.vig?`<div class="sh-row"><span class="ic">⏳</span><div><h4>Vigencia</h4><p>${esc(d.vig)}</p></div></div>`:""}
    </div>
    <div class="sh-actions">
      <a class="btn btn-pri" href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener">${etiqueta}</a>
      ${d.web?`<a class="btn btn-sec" href="${esc(safeUrl(d.web))}" target="_blank" rel="noopener">Sitio del comercio ↗</a>`:""}
      ${nota?`<p class="sh-note">${nota}</p>`:""}
    </div>`;
  ultimoFoco=document.activeElement;
  $("sheet").hidden=false; document.body.style.overflow="hidden";
  $("sh-close").focus();
}
function cerrarDetalle(){
  if($("sheet").hidden)return;
  $("sheet").hidden=true; document.body.style.overflow="";
  if(ultimoFoco&&ultimoFoco.focus)ultimoFoco.focus();
}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet"||e.target.closest("#sh-close"))cerrarDetalle();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")cerrarDetalle();
  const art=e.target.closest&&e.target.closest(".deal");
  if(art&&(e.key==="Enter"||e.key===" ")&&!e.target.closest("button")){e.preventDefault();abrirDetalle(art.dataset.id);}
});
document.addEventListener("click",e=>{
  if(e.target.closest("#sheet"))return;
  const t=e.target.closest("button");
  if(!t){const art=e.target.closest(".deal");if(art)abrirDetalle(art.dataset.id);return;}
  if(t.id==="more"){st.limit+=40;renderList()}
  else if(t.dataset.d){st.day=+t.dataset.d;st.limit=40;all()}
  else if(t.dataset.bank){const k=t.dataset.bank;st.banks.has(k)?st.banks.delete(k):st.banks.add(k);store.set("banks",[...st.banks]);st.limit=40;all()}
  else if(t.dataset.cat){const k=t.dataset.cat;st.cats.has(k)?st.cats.delete(k):st.cats.add(k);store.set("cats",[...st.cats]);st.limit=40;all()}
  else if(t.dataset.fav){const k=+t.dataset.fav;st.favs.has(k)?st.favs.delete(k):st.favs.add(k);store.set("favs2",[...st.favs]);renderList()}
  else if(t.dataset.reg){const k=t.dataset.reg;st.regs.has(k)?st.regs.delete(k):st.regs.add(k);store.set("regs",[...st.regs]);st.limit=40;all()}
  else if(t.id==="clearRegs"){st.regs.clear();store.set("regs",[]);st.limit=40;all()}
  else if(t.id==="clearBanks"){st.banks.clear();store.set("banks",[]);st.limit=40;all()}
  else if(t.id==="clearCats"){st.cats.clear();store.set("cats",[]);st.limit=40;all()}
});
$("q").addEventListener("input",e=>{st.q=e.target.value;st.limit=40;all()});
$("sort").addEventListener("change",e=>{st.sort=e.target.value;renderList()});
async function cargar(){
  $("list").innerHTML='<div class="empty">Cargando descuentos…</div>';
  try{
    const r=await fetch("descuentos.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    DEALS=(Array.isArray(j)?j:j.descuentos).map((d,i)=>({...d,id:d.id??i,upTo:!!d.upTo,loc:d.loc||"",days:d.days?.length?d.days:ALL}));
    if(j.actualizado) $("upd").textContent="Actualizado: "+new Date(j.actualizado).toLocaleString("es-CL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    all();
  }catch(e){
    $("list").innerHTML='<div class="empty">No se pudieron cargar los descuentos ('+e.message+').<br>Revisa tu conexión y vuelve a abrir la app.</div>';
  }
}
cargar();

// En el iPhone la app instalada puede quedar abierta en segundo plano por días.
// Al volver a abrirla: si cambió el día o hay una versión nueva publicada, se recarga sola.
const APP_VERSION="2026-10-19d";
const diaCarga=new Date().toDateString();
async function revisarActualizacion(){
  if(new Date().toDateString()!==diaCarga){location.reload();return;}
  try{
    const html=await fetch("./?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"");
    if(html&&!html.includes('APP_VERSION="'+APP_VERSION+'"')){location.reload();return;}
  }catch{}
  cargar();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")revisarActualizacion();});
window.addEventListener("pageshow",e=>{if(e.persisted)revisarActualizacion();});
</script>
</body>
</html>
